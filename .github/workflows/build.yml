name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # Permette avvio manuale da browser GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Scarica il codice
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17 (richiesto da AGP 8.x)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Gradle — riduce tempo build da ~8min a ~3min
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      # 4. Genera il debug keystore (standard Android — installabile su qualsiasi device)
      - name: Generate debug keystore
        run: |
          mkdir -p keystore
          keytool -genkey -v \
            -keystore keystore/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      # 5. Permessi Gradle wrapper + scarica il JAR se mancante
      - name: Grant Gradle permissions
        run: |
          chmod +x gradlew
          # Scarica gradle-wrapper.jar se non presente o vuoto
          JAR="gradle/wrapper/gradle-wrapper.jar"
          if [ ! -s "$JAR" ]; then
            echo "Scarico gradle-wrapper.jar..."
            curl -sL "https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR"
            echo "JAR scaricato: $(ls -lh $JAR)"
          fi

      # 6. Build release APK (firmato con debug key → installabile direttamente)
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 7. Upload APK come Artifact scaricabile
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebViewer-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30       # Disponibile per 30 giorni

      # 8. Mostra percorso e dimensione APK nel log
      - name: APK info
        run: |
          echo "=== APK generato ==="
          ls -lh app/build/outputs/apk/release/
